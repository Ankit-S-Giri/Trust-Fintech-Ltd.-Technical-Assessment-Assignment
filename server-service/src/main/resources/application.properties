spring.application.name=server-service
server.port=8080

# Tomcat Tuning
server.tomcat.accept-count=20000
server.tomcat.max-connections=20000
server.tomcat.threads.max=400
logging.level.root=WARN

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000

## 2. MySQL Connection Pool Tuning (Widen the pipes)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/transaction_db?createDatabaseIfNotExist=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=I@msolucky1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

